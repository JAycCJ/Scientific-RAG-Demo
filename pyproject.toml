[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs46-scientific-rag"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "bm25s>=0.2.0",
]

[project.optional-dependencies]
retrieval = ["faiss-cpu>=1.8.0"]
embed = [
  "faiss-cpu>=1.8.0",
  "huggingface-hub>=0.23.0",
  "sentence-transformers>=2.7.0",
  "torch>=2.1.0",
]
test = ["faiss-cpu>=1.8.0", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
