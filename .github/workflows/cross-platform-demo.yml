name: Cross-platform demo smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install demo and build index
        run: python setup_demo.py
      - name: Smoke test on macOS
        if: runner.os == 'macOS'
        run: .venv/bin/python scripts/query_rag.py "What is the function of TCF7L2?" --provider offline
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe scripts/query_rag.py "What is the function of TCF7L2?" --provider offline
